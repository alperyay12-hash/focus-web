<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOCUS - Yapay Zekâ Asistanı</title>
  <script defer src="script.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    body {
      background: radial-gradient(circle at top left, #0f172a, #1e293b);
      font-family: 'Segoe UI', sans-serif;
    }
    .chat-bubble {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      margin: 0.25rem 0;
      display: inline-block;
      line-height: 1.4;
      animation: fadeIn 0.3s ease-in-out;
      word-wrap: break-word;
    }
    .chat-user {
      background-color: #2563eb;
      color: white;
      align-self: flex-end;
    }
    .chat-focus {
      background-color: #334155;
      color: #f1f5f9;
      align-self: flex-start;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="flex flex-col h-screen">
  <header class="p-4 text-center text-2xl font-bold text-white bg-gray-900 shadow-lg">
    🤖 FOCUS - Akıllı Asistan
  </header>

  <main id="chat" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-2"></main>

  <footer class="p-4 bg-gray-900 flex">
    <input
      id="userInput"
      type="text"
      placeholder="Bir şey yaz..."
      class="flex-1 p-2 rounded-lg bg-gray-800 text-white focus:outline-none"
    />
    <button id="sendBtn" class="ml-2 bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg font-semibold">
      Gönder
    </button>
  </footer>
</body>
</html>
