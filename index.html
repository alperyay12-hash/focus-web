<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOCUS - Kişisel Asistan</title>
  <script defer src="script.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen">
  <header class="p-4 bg-gray-800 text-center text-2xl font-bold shadow-md">
    🤖 FOCUS - Akıllı Asistan
  </header>

  <main id="chat" class="flex-1 overflow-y-auto p-4 space-y-4">
    <div class="text-gray-400 text-center">Sohbete başla...</div>
  </main>

  <footer class="p-4 bg-gray-800 flex">
    <input id="userInput" type="text" placeholder="Bir şey yaz..." class="flex-1 p-2 rounded-lg bg-gray-700 text-white focus:outline-none">
    <button id="sendBtn" class="ml-2 bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg">Gönder</button>
  </footer>
</body>
</html>
